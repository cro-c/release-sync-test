name: Sync release branches with their base

on:
  push:
    branches:
      - main
      - "RELEASE-*"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync release branches
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PUSHED_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Merge each base into its open release PRs and approve their checks
        id: sync
        env:
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_RELEASE_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          failed=0
          declare -A merged
          declare -A visited
          conflicts=()
          queue=("$PUSHED_BRANCH")

          while [ ${#queue[@]} -gt 0 ]; do
            base=${queue[0]}
            queue=("${queue[@]:1}")
            [ -n "${visited[$base]:-}" ] && continue
            visited[$base]=1

            prs=$(gh pr list --base "$base" --state open --limit 100 \
              --json number,headRefName,isCrossRepository \
              -q '.[] | select(.isCrossRepository | not) | select(.headRefName | startswith("RELEASE-")) | "\(.number) \(.headRefName)"')

            while read -r pr branch; do
              [ -z "$pr" ] && continue

              if ! response=$(gh api -X POST "repos/$GH_REPO/merges" \
                  -f base="$branch" -f head="$base" \
                  -f commit_message="Merge branch '$base' into $branch" 2>&1); then
                if [[ "$response" == *"Merge conflict"* ]]; then
                  echo "::warning::$branch (#$pr) conflicts with $base and must be updated manually"
                  conflicts+=("<https://github.com/$GH_REPO/pull/$pr|#$pr> \`$branch\` conflicts with \`$base\`")
                else
                  echo "::error::$branch (#$pr) could not be updated from $base: $response"
                  failed=1
                fi
                continue
              fi

              sha=$(jq -r '.sha // empty' <<<"$response")
              if [ -z "$sha" ]; then
                echo "$branch (#$pr) is already up to date with $base"
                continue
              fi

              echo "Merged $base into $branch (#$pr) as $sha"
              merged[$sha]=$branch
              queue+=("$branch")
            done <<<"$prs"
          done

          if [ ${#merged[@]} -gt 0 ]; then
            for _ in $(seq 1 18); do
              sleep 10
              for sha in "${!merged[@]}"; do
                for run in $(gh api "repos/$GH_REPO/actions/runs?head_sha=$sha&status=action_required" -q '.workflow_runs[].id'); do
                  if gh api -X POST "repos/$GH_REPO/actions/runs/$run/approve" >/dev/null; then
                    echo "Approved run $run on ${merged[$sha]}"
                  else
                    echo "::error::Could not approve run $run on ${merged[$sha]}"
                    failed=1
                  fi
                done
              done
            done
          fi

          if [ ${#conflicts[@]} -gt 0 ]; then
            payload="$RUNNER_TEMP/release-sync-conflicts.json"
            jq -n \
              --arg channel "$SLACK_CHANNEL_ID" \
              --arg pushed "$PUSHED_BRANCH" \
              --arg list "$(printf '• %s\n' "${conflicts[@]}")" \
              --arg run "$RUN_URL" \
              '{
                channel: $channel,
                text: "Release branches need a manual update",
                blocks: [
                  {type: "header", text: {type: "plain_text", text: "⚠️ Release branches need a manual update", emoji: true}},
                  {type: "section", text: {type: "mrkdwn", text: ("`" + $pushed + "` changed, but these release branches could not be updated automatically:\n" + $list)}},
                  {type: "section", text: {type: "mrkdwn", text: "Resolve the conflicts by merging the base into the release branch by hand."}},
                  {type: "actions", elements: [{type: "button", text: {type: "plain_text", text: "View run"}, url: $run}]}
                ]
              }' > "$payload"
            echo "slack_payload=$payload" >> "$GITHUB_OUTPUT"
          fi

          exit $failed

      - name: Notify Slack about conflicts
        if: ${{ !cancelled() && steps.sync.outputs.slack_payload != '' }}
        uses: slackapi/slack-github-action@v4
        with:
          token: ${{ secrets.SLACK_DEVOPS_BOT_TOKEN }}
          method: chat.postMessage
          payload-file-path: ${{ steps.sync.outputs.slack_payload }}
